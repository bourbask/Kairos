name: kairos

# Config commune aux conteneurs Kairos (scheduler + runs manuels).
x-kairos-common: &kairos-common
  image: kairos:local
  user: "1001:1001"             # conteneurs non-root : fichiers créés = propriété de l'utilisateur hôte
  environment:
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: phi3:mini
    NTFY_URL: http://ntfy      # posté en interne ; NTFY_TOPIC reste un secret (kairos.env)
    DATABASE_PATH: /app/data/kairos.db
    BRIEFINGS_DIR: /app/briefings
    TZ: Europe/Paris          # fuseau de planification
  env_file:
    - path: kairos.env          # secrets optionnels (gitignoré) — cf. ../kairos.env.example
      required: false
  volumes:
    - ../../config:/app/config:ro      # profile.toml (gitignoré, présent sur l'hôte)
    - ../../data:/app/data             # SQLite (bind-mount)
    - ../../briefings:/app/briefings   # briefings lisibles/gérables sur l'hôte
  depends_on:
    ollama:
      condition: service_healthy

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Pas de `ports:` → Ollama joignable uniquement sur le réseau interne du compose.

  radicale:
    image: tomsquest/docker-radicale:latest
    restart: unless-stopped
    volumes:
      - ./radicale/config:/config:ro   # config + auth — hôte uniquement (gitignoré ; cf. config.example)
      - radicale-data:/data
    ports:
      # Adresse de bind configurable ; défaut = boucle locale.
      - "${RADICALE_BIND_ADDR:-127.0.0.1}:5232:5232"

  ntfy:
    image: binwiederhier/ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all   # rien de public : topic + user créés une fois (cf. README)
    volumes:
      - ntfy-auth:/var/lib/ntfy
    ports:
      # Adresse/port de bind configurables (app mobile ntfy) ; défaut = boucle locale.
      # Port hôte 8090 (pas 80) : Traefik occupe déjà le port 80 sur cet hôte.
      - "${NTFY_BIND_ADDR:-127.0.0.1}:${NTFY_BIND_PORT:-8090}:80"
    # ponytail : pas de cache persistant des messages (in-memory only) — ajouter un volume si un
    # message doit survivre à un redémarrage / être livré à un appareil resté hors-ligne trop longtemps.

  # Planificateur interne (supercronic) : scrape 04:30, calendar sync 04:45, briefing 05:00. Toujours actif.
  scheduler:
    <<: *kairos-common
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    init: true                    # tini en PID 1 → supercronic n'est pas PID 1 (évite son reaper qui plante)
    entrypoint: ["supercronic"]
    command: ["/app/supercronic.crontab"]

  # Exécutions manuelles : `docker compose run --rm kairos <scrape|briefing|status|prompt ...>`
  kairos:
    <<: *kairos-common
    profiles: ["tools"]

volumes:
  ollama-models:
  radicale-data:
  ntfy-auth:
