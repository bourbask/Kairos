name: kairos

# Config commune aux conteneurs Kairos (scheduler + runs manuels).
x-kairos-common: &kairos-common
  image: kairos:local
  user: "1001:1001"             # conteneurs non-root : fichiers créés = propriété de l'utilisateur hôte
  environment:
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: phi3:mini
    DATABASE_PATH: /app/data/kairos.db
    BRIEFINGS_DIR: /app/briefings
    TZ: Europe/Paris          # fuseau de planification
  env_file:
    - path: kairos.env          # secrets optionnels (gitignoré) — cf. ../kairos.env.example
      required: false
  volumes:
    - ../../config:/app/config:ro      # profile.toml (gitignoré, présent sur l'hôte)
    - ../../data:/app/data             # SQLite (bind-mount)
    - ../../briefings:/app/briefings   # briefings lisibles/gérables sur l'hôte
  depends_on:
    ollama:
      condition: service_healthy

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Pas de `ports:` → Ollama joignable uniquement sur le réseau interne du compose.

  # Serveur CalDAV self-hosted (brique calendar). Alimenté par un client CalDAV
  # côté utilisateur ; Kairos le lit en interne (http://radicale:5232) pour la
  # section Agenda du briefing.
  radicale:
    image: tomsquest/docker-radicale:latest
    restart: unless-stopped
    volumes:
      - ./radicale/config:/config:ro   # config + users (htpasswd) — gitignoré, sur l'hôte (cf. radicale/config/config.example)
      - radicale-data:/data
    ports:
      # Exposé au client CalDAV sur l'IP tailnet uniquement (défaut localhost si
      # TAILNET_IP non défini). Jamais public : le tailnet chiffre et authentifie.
      - "${TAILNET_IP:-127.0.0.1}:5232:5232"

  # Planificateur interne (supercronic) : scrape 04:30, calendar sync 04:45, briefing 05:00. Toujours actif.
  scheduler:
    <<: *kairos-common
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    init: true                    # tini en PID 1 → supercronic n'est pas PID 1 (évite son reaper qui plante)
    entrypoint: ["supercronic"]
    command: ["/app/supercronic.crontab"]

  # Exécutions manuelles : `docker compose run --rm kairos <scrape|briefing|status|prompt ...>`
  kairos:
    <<: *kairos-common
    profiles: ["tools"]

volumes:
  ollama-models:
  radicale-data:
