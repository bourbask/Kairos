# Kairos — Profil utilisateur
# Copier ce fichier en profile.toml et remplir les valeurs
# Ne jamais commiter profile.toml (gitignored)

[name]
first = "Prénom"
last = "Nom"

[contact]
email = "email@example.com"
location = "Ville / full remote"

[preferences]
salary_min = 35000
salary_target = 50000
salary_max = 80000
currency = "EUR"
remote = "full"          # "full" | "hybrid" | "on-site"
countries = ["FR", "BE", "CH"]
languages = ["français", "anglais"]
min_score = 0.60         # seuil 0-1 : offres sous ce score exclues du briefing (tunable sans rebuild)

[skills]
backend = ["Node.js", "Python"]        # adapter à ton stack
frontend = ["React", "Vue.js"]
database = ["PostgreSQL", "SQLite"]
devops = ["Docker"]
learning = []

[experience]
years = 5
current_role = "Développeur"
current_company = "Entreprise"

[filters]
# Filtrage négatif (optionnel). Sous-chaînes insensibles à la casse.
blacklist_companies = []   # ex. ["ACME", "Foo Corp"] — exclut par nom d'entreprise
blacklist_keywords = []    # ex. ["gambling", "crypto"] — exclut par secteur/terme dans titre/description

[signals]
# Source de signaux prospectifs (probabilités datées) synthétisés dans le briefing.
# Section optionnelle : la retirer ou laisser un champ vide désactive la synthèse.
base_url = ""            # racine de l'API
api_key = ""             # jeton d'accès
auth_header = ""         # nom de l'en-tête portant le jeton
markets_path = ""        # chemin retournant les cotations (peut porter une query string)
forecasts_path = ""      # chemin retournant les estimations
interests = []           # sujets suivis, ex. ["géopolitique", "énergie", "marchés"]
                         # sans cette liste la synthèse ne lit les signaux que sous l'angle emploi
llm_endpoint = "http://localhost:11434"
llm_model = "phi3:mini"
