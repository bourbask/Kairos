# Kairos — Profil utilisateur
# Copier ce fichier en profile.toml et remplir les valeurs
# Ne jamais commiter profile.toml (gitignored)

[name]
first = "Prénom"
last = "Nom"

[contact]
email = "email@example.com"
location = "Ville / full remote"

[preferences]
salary_min = 35000
salary_target = 50000
salary_max = 80000
currency = "EUR"
remote = "full"          # "full" | "hybrid" | "on-site"
countries = ["FR", "BE", "CH"]
languages = ["français", "anglais"]
min_score = 0.60         # seuil 0-1 : offres sous ce score exclues du briefing (tunable sans rebuild)

[skills]
backend = ["Node.js", "Python"]        # adapter à ton stack
frontend = ["React", "Vue.js"]
database = ["PostgreSQL", "SQLite"]
devops = ["Docker"]
learning = []

[experience]
years = 5
current_role = "Développeur"
current_company = "Entreprise"

[filters]
# Filtrage négatif (optionnel). Sous-chaînes insensibles à la casse.
blacklist_companies = []   # ex. ["ACME", "Foo Corp"] — exclut par nom d'entreprise
blacklist_keywords = []    # ex. ["gambling", "crypto"] — exclut par secteur/terme dans titre/description
