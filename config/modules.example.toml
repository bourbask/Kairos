# Kairos — Configuration des modules
# Copier ce fichier en modules.toml et remplir les valeurs
# Ne jamais commiter modules.toml (gitignored)
#
# Chemin modifiable par MODULES_PATH (défaut config/modules.toml).
# Une section par module. Fichier ou section absents : le module est inactif,
# le reste fonctionne normalement.

[signals]
# Source de signaux prospectifs (probabilités datées) synthétisés dans le briefing.
# Laisser un champ vide désactive la synthèse.
base_url = ""            # racine de l'API
api_key = ""             # jeton d'accès
auth_header = ""         # nom de l'en-tête portant le jeton
markets_path = ""        # chemin retournant les cotations (peut porter une query string)
forecasts_path = ""      # chemin retournant les estimations
interests = []           # sujets suivis, ex. ["géopolitique", "énergie", "marchés"]
                         # sans cette liste la synthèse ne lit les signaux que sous l'angle emploi
# Le moteur de synthèse n'est pas déclaré ici : génération différée, stratégique
# par défaut ; le routage vit dans llm.toml (cf. llm.example.toml). Déclaré
# commun, l'usage n'envoie que les signaux publics, sans sujets ni profil.

[jobs]
# Recherche d'emploi. Section absente : repli sur les anciens réglages du profil,
# puis valeurs par défaut. Section présente : elle remplace ces anciens réglages en
# bloc, pas champ par champ.
min_score = 0.60         # seuil 0-1 : offres sous ce score exclues du briefing
location_keywords = []   # ex. ["Ville", "Région"] ; vide = aucune contrainte géographique
# Filtrage négatif : sous-chaînes insensibles à la casse.
blacklist_companies = [] # exclut par nom d'entreprise
blacklist_keywords = []  # exclut par terme dans le titre ou la description
