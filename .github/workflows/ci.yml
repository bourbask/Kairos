name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

permissions:
  contents: read

jobs:
  # Rien de personnel, de secret ni d'environnement ne doit entrer dans le dépôt public.
  osint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" sums.txt | sed 's/gitleaks_.*/gl.tgz/' | sha256sum -c -
          tar xzf gl.tgz gitleaks && sudo install -m755 gitleaks /usr/local/bin/gitleaks && rm -f gl.tgz sums.txt gitleaks
      - name: Contenu et messages des commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=$(git rev-list --max-parents=0 "$HEAD" | tail -1); fi
          scripts/osint-scan.sh --range "$BASE..$HEAD"
      - name: Titre et description de la PR
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | scripts/osint-scan.sh --text -

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo build --workspace --verbose
      - name: Run tests
        run: cargo test --workspace --verbose

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle wrapper download (official, then checksum-pinned mirror)
        working-directory: mobile
        run: |
          for i in 1 2; do ./gradlew --no-daemon -q --version && exit 0; sleep 20; done
          # Same file from a public mirror: the wrapper still verifies distributionSha256Sum.
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-9.9.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon -q --version
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
