name: Check release PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Only develop merges into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::PRs to main must come from 'develop'. Found: '$HEAD_REF'"
            exit 1
          fi

  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Title, version and tags agree
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          VERSION=$(echo "$TITLE" | sed -n 's/^Release \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::error::PR title must be exactly 'Release X.Y.Z'. Found: '$TITLE'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -n "$LAST" ] && [ "$(printf '%s\n%s\n' "$LAST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::Version $VERSION is not greater than the last release $LAST."
            exit 1
          fi
          echo "Release $VERSION (previous: ${LAST:-none})."
      - name: Release notes present
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # La description devient les notes de la release : au moins une section
          # « ## … » suivie d'un élément de liste.
          if ! printf '%s\n' "$BODY" | grep -q '^## ' || ! printf '%s\n' "$BODY" | grep -qE '^[-*] .+'; then
            echo "::error::La description de la PR de release doit contenir les notes de version (sections « ## Nouveautés » / « ## Corrections » avec des éléments de liste)."
            exit 1
          fi
