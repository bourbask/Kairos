name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract version from PR title
        id: extract
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          VERSION=$(echo "$TITLE" | sed -n 's/^Release \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from PR title: $TITLE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v${{ steps.extract.outputs.version }}" -m "Release ${{ steps.extract.outputs.version }}"
          git push origin "v${{ steps.extract.outputs.version }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle wrapper download (official, then checksum-pinned mirror)
        working-directory: mobile
        run: |
          for i in 1 2; do ./gradlew --no-daemon -q --version && exit 0; sleep 20; done
          # Same file from a public mirror: the wrapper still verifies distributionSha256Sum.
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-9.9.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon -q --version
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Signed release APK
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.KAIROS_KEYSTORE_BASE64 }}
          KAIROS_KEYSTORE_PASSWORD: ${{ secrets.KAIROS_KEYSTORE_PASSWORD }}
          KAIROS_KEY_ALIAS: ${{ secrets.KAIROS_KEY_ALIAS }}
          KAIROS_KEY_PASSWORD: ${{ secrets.KAIROS_KEY_PASSWORD }}
          KAIROS_VERSION: ${{ steps.extract.outputs.version }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi
          export KAIROS_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KAIROS_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kairos-v${{ steps.extract.outputs.version }}.apk"
      - name: GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.extract.outputs.version }}" \
            "$RUNNER_TEMP/kairos-v${{ steps.extract.outputs.version }}.apk" \
            --title "Kairos ${{ steps.extract.outputs.version }}" \
            --generate-notes
