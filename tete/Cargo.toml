[package]
name = "tete"
version = "0.1.0"
edition = "2024"

[dependencies]
kairos = { path = ".." }
tentacle-common = { path = "../crates/tentacle-common" }
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
getrandom = "0.3"
percent-encoding = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
