[package]
name = "kairos-memoire"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kairos-memoire"
path = "src/main.rs"

[dependencies]
kairos = { path = "../.." }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
