[package]
name = "kairos-politique"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kairos-politique"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tentacle-common = { path = "../../crates/tentacle-common" }
rmcp = { version = "3.8", features = ["server", "macros"] }
schemars = "1"
