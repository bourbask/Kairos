[package]
name = "kairos-finances"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tentacle-common = { path = "../../crates/tentacle-common" }
rmcp = { version = "3.8", features = ["server", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "kairos-finances"
path = "src/main.rs"

[dev-dependencies]
axum = "0.8"
