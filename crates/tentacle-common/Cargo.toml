[package]
name = "tentacle-common"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.8", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
anyhow = "1"
subtle = "2.6"
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
